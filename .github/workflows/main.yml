name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          # Buat folder-folder profil RDP
          $directories = @(
              "C:\Users\RDP\Desktop",
              "C:\Users\RDP\.claude",
              "C:\Users\RDP\.config\opencode",
              "C:\Users\RDP\.opencode",
              "C:\Users\RDP\AppData\Roaming\opencode"
          )
          foreach ($dir in $directories) {
              New-Item -ItemType Directory -Force -Path $dir
          }
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Setup CLI Tools & AI Configs (Claude Code & OpenCode 9router)
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== Setting up CLI Tools & AI Configs ==="

          $hardcoded9routerUrl = "https://9router.nelsen.web.id/v1"
          $apiKey = if ($env:CLAUDE_API_KEY) { $env:CLAUDE_API_KEY } else { "" }

          # 1. Config Git System-Wide
          Write-Host "[CLI 1/6] Configuring Git..."
          git config --system user.name "${{ secrets.GH_USERNAME }}"
          git config --system user.email "${{ secrets.GH_USERNAME }}@users.noreply.github.com"

          # 2. Configure Global NPM Path to Shared Directory
          Write-Host "[CLI 2/6] Setting up global npm directory for all users..."
          New-Item -ItemType Directory -Force -Path "C:\ProgramData\npm"
          npm config set prefix "C:\ProgramData\npm" --global

          # 3. Install Ollama CLI
          Write-Host "[CLI 3/6] Installing Ollama CLI..."
          try {
              winget install --id Ollama.Ollama --scope machine -e --accept-source-agreements --accept-package-agreements --silent
          } catch {
              $ollamaUrl = "https://ollama.com/download/OllamaSetup.exe"
              $ollamaPath = Join-Path $env:TEMP "OllamaSetup.exe"
              Invoke-WebRequest -Uri $ollamaUrl -OutFile $ollamaPath -UseBasicParsing
              Start-Process $ollamaPath -ArgumentList "/silent" -Wait
          }

          # 4. Install Claude Code CLI
          Write-Host "[CLI 4/6] Installing Claude Code CLI..."
          npm install -g @anthropic-ai/claude-code

          # 5. Config Claude Code 9router Bypass
          Write-Host "[CLI 5/6] Configuring Claude Code for 9router..."
          [Environment]::SetEnvironmentVariable("ANTHROPIC_BASE_URL", $hardcoded9routerUrl, "Machine")
          [Environment]::SetEnvironmentVariable("OPENAI_BASE_URL", $hardcoded9routerUrl, "Machine")
          
          if ($apiKey) {
              [Environment]::SetEnvironmentVariable("ANTHROPIC_API_KEY", $apiKey, "Machine")
              [Environment]::SetEnvironmentVariable("ANTHROPIC_AUTH_TOKEN", $apiKey, "Machine")
              [Environment]::SetEnvironmentVariable("OPENAI_API_KEY", $apiKey, "Machine")
          }

          $claudeObj = @{
              env = @{
                  ANTHROPIC_BASE_URL = $hardcoded9routerUrl
              }
          }
          $claudeObj | ConvertTo-Json -Depth 5 | Set-Content -Path "C:\Users\RDP\.claude\settings.json" -Encoding UTF8

          # 6. Config OpenCode JSON (9router + Models: nelsen-up, nelsen-over, nelsen-vibe)
          Write-Host "[CLI 6/6] Configuring OpenCode for 9router..."
          $opencodeObj = @{
              '$schema' = "https://opencode.ai/config.json"
              provider = @{
                  "9router" = @{
                      npm = "@ai-sdk/openai"
                      name = "9router"
                      options = @{
                          baseURL = $hardcoded9routerUrl
                          apiKey = $apiKey
                      }
                      models = @{
                          "nelsen-up" = @{ name = "nelsen-up" }
                          "nelsen-over" = @{ name = "nelsen-over" }
                          "nelsen-vibe" = @{ name = "nelsen-vibe" }
                      }
                  }
              }
              model = "9router/nelsen-up"
          }
          $opencodeJsonStr = $opencodeObj | ConvertTo-Json -Depth 10
          $opencodeConfigPaths = @(
              "C:\Users\RDP\.config\opencode\opencode.json",
              "C:\Users\RDP\.opencode\config.json",
              "C:\Users\RDP\AppData\Roaming\opencode\config.json"
          )
          foreach ($p in $opencodeConfigPaths) {
              Set-Content -Path $p -Value $opencodeJsonStr -Encoding UTF8
          }

          Write-Host "Claude Code & OpenCode 9router configs applied successfully!"

      - name: Auto Install GUI Apps (WhatsApp, Telegram, Discord, etc.)
        env:
          WA_URL: ${{ secrets.WA_DESKTOP_URL }}
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== Starting GUI Apps Auto-Installation ==="

          # 1. WhatsApp Desktop (.msixbundle via Secret Variable)
          Write-Host "[1/11] Installing WhatsApp Desktop..."
          try {
              if ($env:WA_URL) {
                  $waPath = Join-Path $env:TEMP "whatsapp.msixbundle"
                  Invoke-WebRequest -Uri $env:WA_URL -OutFile $waPath -UseBasicParsing
                  Add-AppxPackage -Path $waPath -AllUsers
                  Remove-Item $waPath -Force -ErrorAction SilentlyContinue
                  Write-Host "WhatsApp Desktop installed successfully!"
              } else {
                  Write-Host "Secret WA_DESKTOP_URL belum diisi, skip WhatsApp..."
              }
          } catch { Write-Host "Link WhatsApp error/expired, skip..." }

          # 2. Telegram Desktop
          Write-Host "[2/11] Installing Telegram Desktop..."
          try {
              $tgUrl = "https://telegram.org/dl/desktop/win64"
              $tgPath = Join-Path $env:TEMP "tsetup.exe"
              Invoke-WebRequest -Uri $tgUrl -OutFile $tgPath -UseBasicParsing
              Start-Process $tgPath -ArgumentList "/VERYSILENT", "/NORESTART" -Wait
              Remove-Item $tgPath -Force -ErrorAction SilentlyContinue
          } catch { Write-Host "Telegram install error, skipping..." }

          # 3. Discord Desktop
          Write-Host "[3/11] Installing Discord..."
          try {
              $discordUrl = "https://discord.com/api/download?platform=win"
              $discordPath = Join-Path $env:TEMP "DiscordSetup.exe"
              Invoke-WebRequest -Uri $discordUrl -OutFile $discordPath -UseBasicParsing
              Start-Process $discordPath -ArgumentList "/s" -Wait
              Remove-Item $discordPath -Force -ErrorAction SilentlyContinue
          } catch { Write-Host "Discord install error, skipping..." }

          # 4. Trae Code Desktop x64
          Write-Host "[4/11] Installing Trae Code..."
          try {
              winget install --id ByteDance.Trae --scope machine -e --accept-source-agreements --accept-package-agreements --silent
          } catch { Write-Host "Trae install error, skipping..." }

          # 5. OpenCode Desktop
          Write-Host "[5/11] Installing OpenCode Desktop..."
          try {
              $opencodeUrl = "https://opencode.ai/download/stable/windows-x64-nsis"
              $opencodePath = Join-Path $env:TEMP "opencode-setup.exe"
              Invoke-WebRequest -Uri $opencodeUrl -OutFile $opencodePath -UseBasicParsing
              Start-Process $opencodePath -ArgumentList "/S" -Wait
              Remove-Item $opencodePath -Force -ErrorAction SilentlyContinue
          } catch { Write-Host "OpenCode install error, skipping..." }

          # 6. Android Studio Desktop
          Write-Host "[6/11] Installing Android Studio..."
          try {
              winget install --id Google.AndroidStudio --scope machine -e --accept-source-agreements --accept-package-agreements --silent
          } catch { Write-Host "Android Studio install error, skipping..." }

          # 7. Brave Browser Desktop
          Write-Host "[7/11] Installing Brave Browser..."
          try {
              winget install --id Brave.Brave --scope machine -e --accept-source-agreements --accept-package-agreements --silent
          } catch { Write-Host "Brave install error, skipping..." }

          # 8. Antigravity Desktop
          Write-Host "[8/11] Installing Google Antigravity..."
          try {
              winget install --id Google.Antigravity --scope machine -e --accept-source-agreements --accept-package-agreements --silent
          } catch { Write-Host "Antigravity install error, skipping..." }

          # 9. PDF Office Desktop (PDF24)
          Write-Host "[9/11] Installing PDF Office..."
          try {
              winget install --id PDF24.PDF24Creator --scope machine -e --accept-source-agreements --accept-package-agreements --silent
          } catch { Write-Host "PDF Office install error, skipping..." }

          # 10. Spotify Desktop
          Write-Host "[10/11] Installing Spotify..."
          try {
              winget install --id Spotify.Spotify --scope machine -e --accept-source-agreements --accept-package-agreements --silent
          } catch { Write-Host "Spotify install error, skipping..." }

          # 11. Canva Desktop
          Write-Host "[11/11] Installing Canva..."
          try {
              winget install --id Canva.Canva --scope machine -e --accept-source-agreements --accept-package-agreements --silent
          } catch { Write-Host "Canva install error, skipping..." }

          Write-Host "=== All GUI Apps Installation Completed ==="

      - name: Sync App Shortcuts, System PATH & Permissions
        run: |
          Write-Host "=== Registering System PATH Registry & Syncing Shortcuts ==="
          
          # 1. Update Registry System PATH (HKLM)
          $sysEnvRegistry = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
          $currentPath = (Get-ItemProperty -Path $sysEnvRegistry).Path
          $pathsToAdd = @(
              "C:\ProgramData\npm",
              "C:\Program Files\nodejs",
              "C:\Program Files\Git\cmd",
              "C:\Program Files\Git\bin",
              "C:\Program Files\Ollama",
              "C:\Users\runneradmin\AppData\Local\Programs\Ollama",
              "C:\Users\runneradmin\AppData\Roaming\npm",
              "C:\Users\RDP\AppData\Roaming\npm"
          )

          foreach ($p in $pathsToAdd) {
              if ($currentPath -notlike "*$p*") {
                  $currentPath = "$currentPath;$p"
              }
          }
          Set-ItemProperty -Path $sysEnvRegistry -Name "Path" -Value $currentPath

          # 2. Buka permission folder runneradmin, ProgramData & RDP
          icacls "C:\Users\runneradmin" /grant "RDP:(OI)(CI)F" /T /q
          icacls "C:\ProgramData\npm" /grant "RDP:(OI)(CI)F" /T /q
          icacls "C:\Users\RDP" /grant "RDP:(OI)(CI)F" /T /q
          
          # 3. Copy semua shortcut (.lnk & .url)
          $rdpDesktop = "C:\Users\RDP\Desktop"
          $publicDesktop = "C:\Users\Public\Desktop"
          $runnerDesktop = "C:\Users\runneradmin\Desktop"
          
          if (Test-Path $runnerDesktop) {
              Get-ChildItem -Path $runnerDesktop -Include *.lnk, *.url -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination $rdpDesktop -Force -ErrorAction SilentlyContinue
          }
          
          $startMenuPaths = @(
              "C:\Users\runneradmin\AppData\Roaming\Microsoft\Windows\Start Menu\Programs",
              "C:\ProgramData\Microsoft\Windows\Start Menu\Programs"
          )
          
          foreach ($path in $startMenuPaths) {
              if (Test-Path $path) {
                  Get-ChildItem -Path $path -Include *.lnk, *.url -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination $rdpDesktop -Force -ErrorAction SilentlyContinue
                  Get-ChildItem -Path $path -Include *.lnk, *.url -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination $publicDesktop -Force -ErrorAction SilentlyContinue
              }
          }
          
          Write-Host "System PATH Registry & Shortcuts successfully updated for RDP User!"

      - name: Auto Clone Private Repository
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          Write-Host "=== Auto Cloning Private Repo ==="
          $desktopPath = "C:\Users\RDP\Desktop\nelsen-dashboard"
          
          if ($env:GH_PAT -and $env:GH_USERNAME) {
              $authenticatedUrl = "https://$($env:GH_USERNAME):$($env:GH_PAT)@github.com/nerusen/nelsen-dashboard.git"
              
              git clone $authenticatedUrl $desktopPath
              
              Set-Location $desktopPath
              git config user.name "$env:GH_USERNAME"
              git config user.email "$env:GH_USERNAME@users.noreply.github.com"
              
              Write-Host "Repo 'nelsen-dashboard' berhasil di-clone di Desktop RDP!"
          } else {
              Write-Warning "Secret GH_PAT atau GH_USERNAME belum diisi! Skip cloning."
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path $env:TEMP "tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          $tsExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tsExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "Cloned Repo: C:\Users\RDP\Desktop\nelsen-dashboard"
          Write-Host "==================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
          
