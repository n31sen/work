name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create Custom RDP User
        run: |
          # BIKIN USERNAME & PASSWORD LU DI SINI (Ganti tulisan di dalem tanda kutip)
          $user = "Nelsen" 
          $pass = "KetintangKeras2026!" 
          
          # Proses inject password beneran ke dalam sistem Windows
          $securePass = ConvertTo-SecureString $pass -AsPlainText -Force
          New-LocalUser -Name $user -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $user
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user
          
          # Pake trik Out-File UTF8 biar variabelnya gak cacat karena encoding Windows
          echo "CURRENT_USER=$user" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CURRENT_PASS=$pass" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
          # Bikin Env Var global biar setup_apps.ps1 tetep jalan
          echo "RDP_USERNAME=$user" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
          if (-not (Get-LocalUser -Name $user)) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Auto Restore Hermes Data dari R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # 1. Download & Siapin Rclone Portable
          Write-Host "Mendownload Rclone..."
          Invoke-WebRequest -Uri "https://downloads.rclone.org/v1.65.0/rclone-v1.65.0-windows-amd64.zip" -OutFile "rclone.zip"
          Expand-Archive -Path "rclone.zip" -DestinationPath "rclone_temp" -Force
          $rclone = "$PWD\rclone_temp\rclone-v1.65.0-windows-amd64\rclone.exe"

          # 2. Setup Otentikasi Cloudflare R2
          $env:RCLONE_CONFIG_MYR2_TYPE = "s3"
          $env:RCLONE_CONFIG_MYR2_PROVIDER = "Cloudflare"
          $env:RCLONE_CONFIG_MYR2_ACCESS_KEY_ID = $env:R2_ACCESS_KEY
          $env:RCLONE_CONFIG_MYR2_SECRET_ACCESS_KEY = $env:R2_SECRET_KEY
          $env:RCLONE_CONFIG_MYR2_ENDPOINT = "https://$($env:R2_ACCOUNT_ID).r2.cloudflarestorage.com"
          $env:RCLONE_CONFIG_MYR2_ACL = "private"

          # 3. Tarik File ZIP Backup ke folder Netral (Public)
          $publicDoc = "C:\Users\Public\Documents"
          Write-Host "Menarik data backup dari R2..."
          & $rclone copy "MYR2:$env:R2_BUCKET/hermes-cli-backup.zip" "$publicDoc\" -q
          & $rclone copy "MYR2:$env:R2_BUCKET/hermes-desktop-backup.zip" "$publicDoc\" -q

          # 4. PASANG RANJAU STARTUP (Biar diekstrak pas lu login)
          $startupFolder = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup"
          $restoreScript = "$startupFolder\AutoRestoreHermes.ps1"
          
          $scriptIsi = @"
          `$ErrorActionPreference = 'SilentlyContinue'
          `$publicDoc = 'C:\Users\Public\Documents'
          
          # Ekstrak data CLI langsung ke kamar user lu
          if (Test-Path `"`$publicDoc\hermes-cli-backup.zip`") {
              Expand-Archive -Path `"`$publicDoc\hermes-cli-backup.zip`" -DestinationPath `$env:LOCALAPPDATA -Force
              Remove-Item `"`$publicDoc\hermes-cli-backup.zip`" -Force
          }
          
          # Ekstrak data Desktop langsung ke kamar user lu
          if (Test-Path `"`$publicDoc\hermes-desktop-backup.zip`") {
              Expand-Archive -Path `"`$publicDoc\hermes-desktop-backup.zip`" -DestinationPath `$env:APPDATA -Force
              Remove-Item `"`$publicDoc\hermes-desktop-backup.zip`" -Force
          }
          
          # Hapus script ini biar besok-besok ga jalan lagi
          Remove-Item `"`$startupFolder\AutoRestoreHermes.bat`" -Force
          Remove-Item `$PSCommandPath -Force
          "@
          Set-Content -Path $restoreScript -Value $scriptIsi -Encoding UTF8

          # Bikin pemicu biar jalan diam-diam tanpa ngerusak mata lu pas login
          $startupBat = "$startupFolder\AutoRestoreHermes.bat"
          $batIsi = "@echo off`nstart /min powershell.exe -WindowStyle Hidden -ExecutionPolicy Bypass -File `"$restoreScript`""
          Set-Content -Path $startupBat -Value $batIsi -Encoding ASCII
          
          Write-Host "Setup Auto-Restore Siap! Nunggu lu login buat ngeksekusi!"
          


      - name: Run Setup Apps Script
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          WA_URL: ${{ secrets.WA_DESKTOP_URL }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if (Test-Path ".\setup_apps.ps1") {
              Write-Host "Menjalankan script instalasi setup_apps.ps1..."
              .\setup_apps.ps1
          } else {
              Write-Warning "File setup_apps.ps1 TIDAK DITEMUKAN di root repository! Skip instalasi aplikasi."
          }

      - name: Install Tailscale
        run: |
          $ProgressPreference = "SilentlyContinue"
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path $env:TEMP "tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          $tsExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          # Ganti hostname pake nama permanen kesukaan lu
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=Nelsen-RDP
         
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tsExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:CURRENT_USER"
          Write-Host "Password: $env:CURRENT_PASS"
          Write-Host "==================`n"
          while ($true) { Start-Sleep -Seconds 300 }
          
