name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

      - name: Setup CLI Tools & Global Configs
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== Setting up CLI Tools & AI Configs ==="

          $hardcoded9routerUrl = "https://9router.nelsen.web.id/v1"
          $apiKey = if ($env:CLAUDE_API_KEY) { $env:CLAUDE_API_KEY } else { "" }

          # 1. Config Git
          git config --system user.name "${{ secrets.GH_USERNAME }}"
          git config --system user.email "${{ secrets.GH_USERNAME }}@users.noreply.github.com"

          # 2. Config NPM Global
          New-Item -ItemType Directory -Force -Path "C:\ProgramData\npm"
          npm config set prefix "C:\ProgramData\npm" --global

          # 3. Ollama
          try {
              $ProgressPreference = 'SilentlyContinue'
              $ollamaUrl = "https://ollama.com/download/OllamaSetup.exe"
              $ollamaPath = Join-Path $env:TEMP "OllamaSetup.exe"
              Invoke-WebRequest -Uri $ollamaUrl -OutFile $ollamaPath -UseBasicParsing
              Start-Process $ollamaPath -ArgumentList "/silent" -Wait
              Stop-Process -Name "ollama" -Force -ErrorAction SilentlyContinue
          } catch { Write-Warning "Ollama gagal" }

          # 4. Claude Code
          npm install -g @anthropic-ai/claude-code

          # 5. Machine Level Environment Variables (Biar lgsg nempel ke RDP user)
          [Environment]::SetEnvironmentVariable("ANTHROPIC_BASE_URL", $hardcoded9routerUrl, "Machine")
          [Environment]::SetEnvironmentVariable("OPENAI_BASE_URL", $hardcoded9routerUrl, "Machine")
          
          if ($apiKey) {
              [Environment]::SetEnvironmentVariable("ANTHROPIC_API_KEY", $apiKey, "Machine")
              [Environment]::SetEnvironmentVariable("ANTHROPIC_AUTH_TOKEN", $apiKey, "Machine")
              [Environment]::SetEnvironmentVariable("OPENAI_API_KEY", $apiKey, "Machine")
          }
          
          # 6. Auto-Setup JSON Scripts (Dijalankan via Public Startup)
          $startupFolder = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup"
          $initScriptPath = "$startupFolder\init_ai_configs.ps1"
          
          # Tulis file script startup baris per baris biar aman dari error YAML
          New-Item -ItemType File -Force -Path $initScriptPath
          Add-Content -Path $initScriptPath -Value "`$userProfile = `$env:USERPROFILE"
          Add-Content -Path $initScriptPath -Value "`$claudeDir = Join-Path `$userProfile '.claude'"
          Add-Content -Path $initScriptPath -Value "if (-not (Test-Path `$claudeDir)) { New-Item -ItemType Directory -Force -Path `$claudeDir }"
          Add-Content -Path $initScriptPath -Value "`$claudeJson = @{ env = @{ ANTHROPIC_BASE_URL = '$hardcoded9routerUrl' } }"
          Add-Content -Path $initScriptPath -Value "`$claudeJson | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path `$claudeDir 'settings.json') -Encoding UTF8"
          
          Add-Content -Path $initScriptPath -Value "`$opencodeDirs = @( (Join-Path `$userProfile '.config\opencode'), (Join-Path `$userProfile '.opencode'), (Join-Path `$userProfile 'AppData\Roaming\opencode') )"
          Add-Content -Path $initScriptPath -Value "foreach (`$d in `$opencodeDirs) { if (-not (Test-Path `$d)) { New-Item -ItemType Directory -Force -Path `$d } }"
          Add-Content -Path $initScriptPath -Value "`$opencodeObj = @{ '`$schema' = 'https://opencode.ai/config.json'; provider = @{ '9router' = @{ npm = '@ai-sdk/openai'; name = '9router'; options = @{ baseURL = '$hardcoded9routerUrl'; apiKey = '$apiKey' }; models = @{ 'nelsen-up' = @{ name = 'nelsen-up' }; 'nelsen-over' = @{ name = 'nelsen-over' }; 'nelsen-vibe' = @{ name = 'nelsen-vibe' } } } }; model = '9router/nelsen-up' }"
          Add-Content -Path $initScriptPath -Value "`$opencodeJsonStr = `$opencodeObj | ConvertTo-Json -Depth 10"
          Add-Content -Path $initScriptPath -Value "foreach (`$d in `$opencodeDirs) { Set-Content -Path (Join-Path `$d 'config.json') -Value `$opencodeJsonStr -Encoding UTF8 }"
          Add-Content -Path $initScriptPath -Value "Remove-Item -Path `$PSCommandPath -Force"
          
          # Bikin shortcut biar powershell eksekusi script ini saat startup
          $wshShell = New-Object -ComObject WScript.Shell
          $shortcut = $wshShell.CreateShortcut("$startupFolder\InitAIConfigs.lnk")
          $shortcut.TargetPath = "powershell.exe"
          $shortcut.Arguments = "-ExecutionPolicy Bypass -WindowStyle Hidden -File `"$initScriptPath`""
          $shortcut.Save()

          Write-Host "System Tools & AI Configs prepared successfully!"
          exit 0

      - name: Auto Install GUI Apps
        env:
          WA_URL: ${{ secrets.WA_DESKTOP_URL }}
        run: |
          $ErrorActionPreference = "Continue"
          
          # 1. WhatsApp Desktop (Langsung tembak ke Public Desktop)
          if ($env:WA_URL) {
              try {
                  $waPath = "C:\Users\Public\Desktop\WhatsApp_Installer.msixbundle"
                  Invoke-WebRequest -Uri $env:WA_URL -OutFile $waPath -UseBasicParsing
              } catch { Write-Warning "WhatsApp gagal didownload" }
          }
          
          # Pakai Choco untuk yang gampang
          choco install telegram discord androidstudio brave pdf24 spotify -y --ignore-checksums

          # Trae Code
          try { winget install --id ByteDance.Trae --source winget --accept-source-agreements --accept-package-agreements --silent } catch {}
          
          # Antigravity
          try { winget install --id Google.Antigravity --source winget --accept-source-agreements --accept-package-agreements --silent } catch {}

          # OpenCode Desktop
          try {
              $ProgressPreference = 'SilentlyContinue'
              $opencodeUrl = "https://opencode.ai/download/stable/windows-x64-nsis"
              $opencodePath = Join-Path $env:TEMP "opencode-setup.exe"
              Invoke-WebRequest -Uri $opencodeUrl -OutFile $opencodePath -UseBasicParsing
              Start-Process $opencodePath -ArgumentList "/S" -Wait
          } catch {}

          # Canva Desktop
          try {
              $canvaUrl = "https://desktop-release.canva.com/Canva%20Setup.exe"
              $canvaPath = Join-Path $env:TEMP "CanvaSetup.exe"
              Invoke-WebRequest -Uri $canvaUrl -OutFile $canvaPath -UseBasicParsing
              Start-Process $canvaPath -ArgumentList "/S" -Wait
          } catch {}
          
          exit 0

      - name: Sync App Shortcuts & System PATH to PUBLIC
        run: |
          # 1. Update Registry System PATH
          $sysEnvRegistry = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
          $currentPath = (Get-ItemProperty -Path $sysEnvRegistry).Path
          $pathsToAdd = @(
              "C:\ProgramData\npm", "C:\Program Files\nodejs", "C:\Program Files\Git\cmd", "C:\Program Files\Git\bin",
              "C:\Program Files\Ollama", "C:\Users\runneradmin\AppData\Local\Programs\Ollama", "C:\Users\runneradmin\AppData\Roaming\npm"
          )
          foreach ($p in $pathsToAdd) { if ($currentPath -notlike "*$p*") { $currentPath = "$currentPath;$p" } }
          Set-ItemProperty -Path $sysEnvRegistry -Name "Path" -Value $currentPath

          # 2. Fix Permissions
          icacls "C:\Users\runneradmin" /grant "Users:(OI)(CI)RX" /T /q
          icacls "C:\ProgramData\npm" /grant "Users:(OI)(CI)F" /T /q
          
          # 3. Pindah Shortcuts ke C:\Users\Public\Desktop biar otomatis kebaca sama semua user
          $publicDesktop = "C:\Users\Public\Desktop"
          $runnerDesktop = "C:\Users\runneradmin\Desktop"
          $allowedApps = @("Brave", "Canva", "Discord", "Telegram", "Spotify", "Android Studio", "Trae", "OpenCode", "PDF24", "Antigravity", "Ollama")
          
          # Dari Runner Desktop ke Public
          if (Test-Path $runnerDesktop) {
              $allShortcuts = Get-ChildItem -Path $runnerDesktop -Include *.lnk, *.url -Recurse -ErrorAction SilentlyContinue
              foreach ($shortcut in $allShortcuts) {
                  foreach ($app in $allowedApps) {
                      if ($shortcut.Name -match $app) {
                          Copy-Item -Path $shortcut.FullName -Destination $publicDesktop -Force -ErrorAction SilentlyContinue
                          break
                      }
                  }
              }
          }
          
          # Dari Start Menu ke Public
          $startMenuPaths = @(
              "C:\Users\runneradmin\AppData\Roaming\Microsoft\Windows\Start Menu\Programs",
              "C:\ProgramData\Microsoft\Windows\Start Menu\Programs"
          )
          foreach ($path in $startMenuPaths) {
              if (Test-Path $path) {
                  $allStartMenuShortcuts = Get-ChildItem -Path $path -Include *.lnk, *.url -Recurse -ErrorAction SilentlyContinue
                  foreach ($shortcut in $allStartMenuShortcuts) {
                      foreach ($app in $allowedApps) {
                          if ($shortcut.Name -match $app) {
                              Copy-Item -Path $shortcut.FullName -Destination $publicDesktop -Force -ErrorAction SilentlyContinue
                              break
                          }
                      }
                  }
              }
          }
          exit 0

      - name: Auto Clone Private Repository ke PUBLIC Desktop
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Ditaruh di Public Desktop biar langsung muncul di user manapun
          $desktopPath = "C:\Users\Public\Desktop\nelsen-dashboard"
          if ($env:GH_PAT -and $env:GH_USERNAME) {
              $authenticatedUrl = "https://$($env:GH_USERNAME):$($env:GH_PAT)@github.com/nerusen/nelsen-dashboard.git"
              git clone $authenticatedUrl $desktopPath
              Set-Location $desktopPath
              git config user.name "$env:GH_USERNAME"
              git config user.email "$env:GH_USERNAME@users.noreply.github.com"
          }
          exit 0

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path $env:TEMP "tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait

      - name: Establish Tailscale Connection
        run: |
          $tsExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tsExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) { exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) { exit 1 }

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          while ($true) { Start-Sleep -Seconds 300 }
          
